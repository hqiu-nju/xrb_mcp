[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xrb-mcp"
version = "0.1.0"
description = "Provenance-aware X-ray binary literature research over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "SQLAlchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.6,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "PyMuPDF>=1.25,<2",
  "numpy>=2,<3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.4,<6"]
astronomy = ["astropy>=7,<9", "astroquery>=0.4.9,<1", "pandas>=2.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
xrb-mcp = "xrb_mcp.server.main:main"
xrb-ingest = "xrb_mcp.scripts.ingest:main"
xrb-update = "xrb_mcp.scripts.update:main"
xrb-source = "xrb_mcp.scripts.sources:main"
xrb-rebuild-embeddings = "xrb_mcp.scripts.rebuild_embeddings:main"
xrb-validate = "xrb_mcp.scripts.validate_database:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xrb_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires XRB_TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
